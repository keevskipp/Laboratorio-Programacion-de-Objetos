spring.application.name=agenda-web

# Base de datos H2 en memoria (vive dentro de la aplicacion)
spring.datasource.url=jdbc:h2:mem:agenda
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate (la parte de JPA que habla con la base de datos)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# update = crea la tabla al arrancar y no la borra mientras la app este corriendo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
