spring.application.name=agenda-web

# Conexion a MySQL (la base de datos "agenda" se crea antes, ver LEEME.txt)
spring.datasource.url=jdbc:mysql://localhost:3306/agenda?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
# CAMBIA ESTO por la contrasena que le pusiste a tu MySQL
spring.datasource.password=Titina126:)

# Dialecto para MySQL 8
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# update = crea la tabla si no existe y NO borra los datos al reiniciar
spring.jpa.hibernate.ddl-auto=update
# muestra en la consola el SQL que se manda a MySQL
spring.jpa.show-sql=true
