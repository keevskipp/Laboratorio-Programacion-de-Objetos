<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agenda de Contactos</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
            font-family: Arial, sans-serif;
            padding: 30px;
        }
        h1 { color: #4a90e2; text-align: center; }
        .boton {
            display: inline-block;
            background-color: #4a90e2;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            margin-bottom: 20px;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            border: 1px solid #4a90e2;
            padding: 10px;
            text-align: left;
        }
        th { background-color: #16213e; color: #4a90e2; }
        .editar { color: #4a90e2; margin-right: 12px; }
        .eliminar { color: #e74c3c; }
        .vacio { text-align: center; margin-top: 30px; }
    </style>
</head>
<body>
    <h1>Agenda de Contactos</h1>

    <a class="boton" th:href="@{/nuevo}">+ Nuevo contacto</a>

    <!-- Si hay contactos mostramos la tabla -->
    <table th:if="${!contactos.isEmpty()}">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Email</th>
                <th>Telefono</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${contactos}">
                <td th:text="${c.nombre}">Nombre</td>
                <td th:text="${c.apellido}">Apellido</td>
                <td th:text="${c.email}">correo@ejemplo.com</td>
                <td th:text="${c.telefono}">0000000000</td>
                <td>
                    <a class="editar" th:href="@{/editar/{id}(id=${c.id})}">Editar</a>
                    <a class="eliminar" th:href="@{/eliminar/{id}(id=${c.id})}"
                       onclick="return confirm('Seguro que quieres borrar este contacto?');">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Si no hay contactos mostramos un mensaje -->
    <p class="vacio" th:unless="${!contactos.isEmpty()}">
        Todavia no hay contactos. Agrega el primero con el boton de arriba.
    </p>
</body>
</html>
